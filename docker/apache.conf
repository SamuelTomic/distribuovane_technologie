ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/api(/.*)?$ /api.php [L,QSA]

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    # Health checky a stavové dotazy medzi uzlmi nelogujeme (spamovali by centrálne logy).
    SetEnvIf Request_URI "^/(health\.php|api/status|api/cluster|api/records|api/outbox)" nolog
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!nolog
</VirtualHost>
