# Lokálna simulácia: 3 uzly (A, B, C) na jednom Docker hostiteľovi.
# Každý uzol = web (nginx vstup) + app (PHP + REST API) + worker (synchronizácia) + vlastná MySQL s vlastným volume.
# Spustenie: scripts/deploy-local.ps1   (alebo: docker compose up -d --build --wait)
name: dt-projekt

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  image: dt-node:${APP_VERSION:-1.0.0}
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-1.0.0}
  environment: &app-env
    DB_NAME: poruchy
    DB_USER: app
    DB_PASSWORD: ${DB_PASSWORD:?Chýba .env – spustite scripts/deploy-local.ps1}
    REPLICATION_TOKEN: ${REPLICATION_TOKEN:?Chýba .env}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health.php || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  restart: unless-stopped
  logging: *logging

x-worker: &worker
  <<: *app
  command: ["php", "/var/www/app/bin/worker.php"]
  healthcheck:
    test: ["CMD", "php", "/var/www/app/bin/healthcheck-worker.php"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s

x-gateway: &gateway
  image: nginx:1.27-alpine
  volumes:
    - ./docker/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health.php >/dev/null || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
  restart: unless-stopped
  logging: *logging

x-db: &db
  image: mysql:8.4
  environment:
    MYSQL_DATABASE: poruchy
    MYSQL_USER: app
    MYSQL_PASSWORD: ${DB_PASSWORD:?Chýba .env}
    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Chýba .env}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  restart: unless-stopped
  logging: *logging

services:
  # ---------------- Uzol A ----------------
  node-a-db:
    <<: *db
    volumes: [node_a_db_data:/var/lib/mysql]
    networks: [node-a-private]
  node-a-app:
    <<: *app
    env_file: config/local/node-a.env
    depends_on: { node-a-db: { condition: service_healthy } }
    networks: [node-a-private, replication]
  node-a-web:
    <<: *gateway
    environment: { APP_HOST: node-a-app }
    ports: ["8081:80"]
    depends_on: [node-a-app]
    networks: [node-a-private]
  node-a-worker:
    <<: *worker
    env_file: config/local/node-a.env
    depends_on: { node-a-db: { condition: service_healthy } }
    networks: [node-a-private, replication]

  # ---------------- Uzol B ----------------
  node-b-db:
    <<: *db
    volumes: [node_b_db_data:/var/lib/mysql]
    networks: [node-b-private]
  node-b-app:
    <<: *app
    env_file: config/local/node-b.env
    depends_on: { node-b-db: { condition: service_healthy } }
    networks: [node-b-private, replication]
  node-b-web:
    <<: *gateway
    environment: { APP_HOST: node-b-app }
    ports: ["8082:80"]
    depends_on: [node-b-app]
    networks: [node-b-private]
  node-b-worker:
    <<: *worker
    env_file: config/local/node-b.env
    depends_on: { node-b-db: { condition: service_healthy } }
    networks: [node-b-private, replication]

  # ---------------- Uzol C ----------------
  node-c-db:
    <<: *db
    volumes: [node_c_db_data:/var/lib/mysql]
    networks: [node-c-private]
  node-c-app:
    <<: *app
    env_file: config/local/node-c.env
    depends_on: { node-c-db: { condition: service_healthy } }
    networks: [node-c-private, replication]
  node-c-web:
    <<: *gateway
    environment: { APP_HOST: node-c-app }
    ports: ["8083:80"]
    depends_on: [node-c-app]
    networks: [node-c-private]
  node-c-worker:
    <<: *worker
    env_file: config/local/node-c.env
    depends_on: { node-c-db: { condition: service_healthy } }
    networks: [node-c-private, replication]

  # ---------------- Centralizované logy ----------------
  dozzle:
    image: amir20/dozzle:${DOZZLE_VERSION:-v8.14.4}
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=dt-projekt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["8090:8080"]
    restart: unless-stopped
    logging: *logging

volumes:
  node_a_db_data:
  node_b_db_data:
  node_c_db_data:

networks:
  # Sieť, cez ktorú si uzly vymieňajú operácie. Odpojenie od nej = výpadok uzla.
  replication:
    name: dt-replication
  node-a-private:
  node-b-private:
  node-c-private:
