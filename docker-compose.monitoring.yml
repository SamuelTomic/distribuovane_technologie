# Centrálne logovanie pre viac hostiteľov: Dozzle UI sa pripojí na Dozzle agentov na každom uzle.
# Agent beží na každom uzle automaticky (COMPOSE_PROFILES=logging v config/hosts/node-X.env, port AGENT_PORT).
# Spúšťa ho scripts/setup-three-hosts.ps1, ručne:
#   $env:DOZZLE_AGENTS = "172.20.10.2:7007,172.20.10.11:7007,172.20.10.7:7007"
#   docker compose -f docker-compose.monitoring.yml up -d      → http://localhost:8099
name: dt-monitoring

services:
  dozzle:
    image: amir20/dozzle:${DOZZLE_VERSION:-v8.14.4}
    environment:
      DOZZLE_REMOTE_AGENT: ${DOZZLE_AGENTS:?Nastavte DOZZLE_AGENTS=ip1:7007,ip2:7007,ip3:7007}
    ports: ["8099:8080"]
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 10.201.250.0/24
