# Jeden uzol na jednom hostiteľovi (VM alebo iný počítač). Všetky hostitele používajú
# tento istý súbor aj image – líšia sa iba konfiguráciou v config/hosts/node-X.env.
#
#   docker compose -f docker-compose.node.yml --env-file config/hosts/node-b.env up -d --build --wait
#   (alebo scripts/deploy-node.sh / scripts/deploy-node.ps1)
#
# Porty: UI_PORT = webové rozhranie pre ľudí, PEER_PORT = replikácia medzi uzlami.
# Oddelené porty umožňujú simulovať výpadok firewallom (scripts/partition.*) a obmedziť replikáciu na IP peerov.
#
# Obnova kontajnerov: restart: unless-stopped reštartuje spadnutý kontajner; služba autoheal navyše
# reštartuje kontajner, ktorý beží, ale health check ho hlási ako unhealthy (napr. zaseknutý worker).
# Centrálne logy: dozzle-agent (zapína sa cez COMPOSE_PROFILES=logging v konfigurácii uzla).
name: dt-node

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  image: dt-node:${APP_VERSION:-1.0.0}
  labels: { autoheal: "true" }
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-1.0.0}
  environment:
    NODE_ID: ${NODE_ID:?Chýba NODE_ID – použite --env-file config/hosts/node-X.env}
    NODE_LABEL: ${NODE_LABEL:-}
    PEER_NODES: ${PEER_NODES:?Chýba PEER_NODES}
    DB_HOST: db
    DB_NAME: poruchy
    DB_USER: app
    DB_PASSWORD: ${DB_PASSWORD:?Chýba DB_PASSWORD}
    REPLICATION_TOKEN: ${REPLICATION_TOKEN:?Chýba REPLICATION_TOKEN}
    SYNC_INTERVAL: ${SYNC_INTERVAL:-2}
    PULL_INTERVAL: ${PULL_INTERVAL:-15}
  depends_on:
    db: { condition: service_healthy }
  networks: [node]
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: mysql:8.4
    labels: { autoheal: "true" }
    environment:
      MYSQL_DATABASE: poruchy
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Chýba DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Chýba DB_ROOT_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [node]
    restart: unless-stopped
    logging: *logging

  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health.php || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["php", "/var/www/app/bin/worker.php"]
    healthcheck:
      test: ["CMD", "php", "/var/www/app/bin/healthcheck-worker.php"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: nginx:1.27-alpine
    labels: { autoheal: "true" }
    environment: { APP_HOST: app }
    volumes:
      - ./docker/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${UI_PORT:-8080}:80"
      - "${PEER_PORT:-9080}:80"
    depends_on: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health.php >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [node]
    restart: unless-stopped
    logging: *logging

  # Reštartuje kontajnery s labelom autoheal=true, keď ich health check hlási unhealthy.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    network_mode: none   # sieť nepotrebuje – s Dockerom komunikuje cez socket
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 5
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging

  # Agent pre centrálne logy (docker-compose.monitoring.yml). Zapnutie: COMPOSE_PROFILES=logging alebo --profile logging
  dozzle-agent:
    image: amir20/dozzle:${DOZZLE_VERSION:-v8.14.4}
    command: agent
    environment:
      DOZZLE_HOSTNAME: node-${NODE_ID}
      DOZZLE_FILTER: label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-dt-node}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["${AGENT_PORT:-7007}:7007"]
    networks: [node]
    profiles: [logging]
    restart: unless-stopped
    logging: *logging

volumes:
  db_data:

networks:
  # Pevný rozsah, aby nekolidoval s LAN/hotspotom (Docker inak berie 172.x.0.0/16, napr. 172.20 = iPhone hotspot).
  node:
    ipam:
      config:
        - subnet: ${NODE_SUBNET:-10.201.0.0/24}
